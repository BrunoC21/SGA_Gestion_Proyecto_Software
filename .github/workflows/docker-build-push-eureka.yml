# .github/workflows/docker-build-push-eureka.yml
name: Build and Push Docker Image (microservice-eureka)

on:
  push:
    paths:
      - 'microservice-eureka/**'
      - 'pom.xml'
      - '.github/workflows/docker-build-push-eureka.yml'
    branches:
      - prueba

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tag
        id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./microservice-eureka/Dockerfile
          platforms: linux/amd64
          push: true
          tags: brunocaro/microservice-eureka:${{ steps.vars.outputs.tag }}

      - name: Update values.yaml
        run: |
          sed -i "s|brunocaro/microservice-eureka:.*|brunocaro/microservice-eureka:${{ steps.vars.outputs.tag }}|" microservices-helm-repo/charts/infra-chart/values.yaml

      - name: Commit and push updated values.yaml
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add microservices-helm-repo/charts/infra-chart/values.yaml
          git commit -m "Update eureka image to tag ${{ steps.vars.outputs.tag }}" || echo "No changes to commit"
          git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/BrunoC21/SGA_Gestion_Proyecto_Software.git
          git push origin prueba