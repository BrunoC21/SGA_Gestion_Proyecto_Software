name: Build and Push Docker Image (microservice-inventory)

on:
  push:
    paths:
      - 'microservice-inventory/**'
      - 'pom.xml'
      - '.github/workflows/docker-build-push-inventory.yml'
    branches:
      - prueba

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run unit tests
        run: mvn test
        working-directory: ./microservice-inventory

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tag
        id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./microservice-inventory/Dockerfile
          platforms: linux/amd64
          push: true
          tags: brunocaro/microservice-inventory:${{ steps.vars.outputs.tag }}

      - name: Update inventory image tag in values.yaml
        run: |
          sed -i "s|brunocaro/microservice-inventory:.*|brunocaro/microservice-inventory:${{ steps.vars.outputs.tag }}|" microservices-helm-repo/charts/microservices-chart/values.yaml

      - name: Commit and push updated values.yaml
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add microservices-helm-repo/charts/infra-chart/values.yaml
          git commit -m "Update inventory image to tag ${{ steps.vars.outputs.tag }}"
          git push
