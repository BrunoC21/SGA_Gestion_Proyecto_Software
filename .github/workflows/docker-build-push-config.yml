name: Build and Push Docker Image (microservice-config)

on:
  push:
    paths:
      - 'microservice-config/**'
      - 'pom.xml'
      - '.github/workflows/docker-build-push-config.yml'
    branches:
      - prueba
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tag
        id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./microservice-config/Dockerfile
          platforms: linux/amd64
          push: true
          tags: brunocaro/microservice-config:${{ steps.vars.outputs.tag }}

      - name: Update values.yaml
        run: |
          sed -i "s|brunocaro/microservice-config:.*|brunocaro/microservice-config:${{ steps.vars.outputs.tag }}|" microservices-helm-repo/charts/config-chart/values.yaml

      - name: Commit and push updated values.yaml
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add microservices-helm-repo/charts/config-chart/values.yaml
          git commit -m "Update config image to tag ${{ steps.vars.outputs.tag }}" || echo "No changes to commit"
          git pull --rebase origin prueba
          git push --force-with-lease origin prueba
