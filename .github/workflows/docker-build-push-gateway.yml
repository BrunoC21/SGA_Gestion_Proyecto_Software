# .github/workflows/docker-build-push-gateway.yml
name: Build and Push Docker Image (microservice-gateway)

on:
  push:
    paths:
      - 'microservice-gateway/**'
      - '.github/workflows/docker-build-push-gateway.yml'
    branches:
      - prueba

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./microservice-gateway
          file: ./microservice-gateway/Dockerfile
          platforms: linux/amd64
          push: true
          tags: brunocaro/microservice-gateway:latest
