apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: microservices-chart
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/BrunoC21/SGA_Gestion_Proyecto_Software'  # o usa 'https://chartmuseum.local/' si lo tienes en chart repo
    targetRevision: HEAD
    path: microservices-chart
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
