eureka:
  client:
    register-with-eureka: true
    service-url:
      defaultZone: http://msvc-eureka:8761/eureka/

server:
  port: 8080

spring:
  application:
    name: msvc-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: inventory
          uri: lb://msvc-inventory
          predicates:
            - Path=/api/inventory/**