apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config
  template:
    metadata:
      labels:
        app: config
    spec:
      containers:
        - name: config
          image: "{{ .Values.microservices.config.image }}"
          ports:
            - containerPort: {{ .Values.microservices.config.port }}
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.microservices.config.port }}
            initialDelaySeconds: 5
            periodSeconds: 5