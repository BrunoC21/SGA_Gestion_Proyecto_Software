apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      containers:
        - name: inventory
          image: "{{ .Values.microservices.inventory.image }}"
          ports:
            - containerPort: {{ .Values.microservices.inventory.port }}
          env:
            - name: SPRING_CONFIG_IMPORT
              value: configserver:http://config-server:8888/
---
apiVersion: v1
kind: Service
metadata:
  name: msvc-inventory
spec:
  selector:
    app: inventory
  ports:
    - port: {{ .Values.microservices.inventory.port }}
      targetPort: {{ .Values.microservices.inventory.port }}
  type: ClusterIP