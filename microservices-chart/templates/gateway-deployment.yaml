apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.microservices.gateway.image }}"  # Reemplazamos por la plantilla de Helm
          ports:
            - containerPort: {{ .Values.microservices.gateway.port }}  # Reemplazamos por la plantilla de Helm
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app: gateway
  ports:
    - port: {{ .Values.microservices.gateway.port }}  # Reemplazamos por la plantilla de Helm
      targetPort: {{ .Values.microservices.gateway.port }}
  type: ClusterIP
