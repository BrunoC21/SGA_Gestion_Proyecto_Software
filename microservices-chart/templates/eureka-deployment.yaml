apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka
  template:
    metadata:
      labels:
        app: eureka
    spec:
      containers:
        - name: eureka
          image: "{{ .Values.microservices.eureka.image }}"  # Reemplazamos por la plantilla de Helm
          ports:
            - containerPort: {{ .Values.microservices.eureka.port }}  # Reemplazamos por la plantilla de Helm
---
apiVersion: v1
kind: Service
metadata:
  name: msvc-eureka
spec:
  selector:
    app: eureka
  ports:
    - port: {{ .Values.microservices.eureka.port }}  # Reemplazamos por la plantilla de Helm
      targetPort: {{ .Values.microservices.eureka.port }}
  type: ClusterIP
