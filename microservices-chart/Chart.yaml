apiVersion: v2
name: microservices-chart
description: A Helm chart for deploying Spring Boot microservices and PostgreSQL
type: application
version: 0.1.0
appVersion: "1.0"
dependencies:
  - name: config
    version: 0.1.0
    repository: "file://charts/config"
  - name: eureka
    version: 0.1.0
    repository: "file://charts/eureka"
    dependencies:
      - name: config
  - name: gateway
    version: 0.1.0
    repository: "file://charts/gateway"
    dependencies:
      - name: config
  - name: inventory
    version: 0.1.0
    repository: "file://charts/inventory"
    dependencies:
      - name: config
  - name: postgres
    version: 0.1.0
    repository: "file://charts/postgres"
